name: Game checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  simulation-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: for file in dist/*.js; do node --check "$file"; done
      - name: Test gameplay and sprite assets
        run: npm test
