<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drawn Animation Library · Jujutsu Valley</title><style>@font-face{font-family:Pixel;src:url(fonts/pixelify-regular.ttf)}*{box-sizing:border-box}body{background:#101b2c;color:#e0edf8;font-family:Pixel,monospace;margin:0;padding:24px}main{max-width:1000px;margin:auto}a{color:#8de4df}h1{font-size:30px}p{color:#a9bed3}label{display:inline-grid;gap:8px;margin:0 18px 18px 0}select,button{font:inherit;color:inherit;background:#23354d;border:2px solid #637c9e;padding:10px}canvas{image-rendering:pixelated;max-width:100%;background:repeating-conic-gradient(#24344b 0% 25%,#1e2d40 0% 50%) 0/20px 20px;border:2px solid #617896}#stage{width:384px;height:384px;display:block;margin:16px auto}#strip{width:100%;height:auto}small{display:block;margin:16px 0}</style><main><a href="./">← Return to game</a><h1>Drawn animation library</h1><p>Inspect the new full-body drawings used in the game. Pause to inspect a frame, or change action and direction.</p><label>Character<select id="hero"></select></label><label>Action<select id="clip"></select></label><label>Direction<select id="direction"><option value="south">Front</option><option value="north">Back</option><option value="side">Right</option><option value="west">Left</option></select></label><button id="pause">Pause</button><button id="step">Next frame</button><canvas id="stage" width="128" height="128"></canvas><small id="caption"></small><canvas id="strip" width="1024" height="128"></canvas><p id="sources"></p></main><script type="module">
import {HEROES,CLIPS,ENEMIES} from './data.js';import {loadCharacterArt,drawHero,drawEnemyAnimation,ENEMY_CLIPS} from './sprites.js';import {animationFrame} from './animation-timing.js';
const $=id=>document.getElementById(id);await loadCharacterArt();$('hero').innerHTML=[...HEROES,...ENEMIES,{id:'panda',name:'Panda'},{id:'dog',name:'Divine Dog'},{id:'nue',name:'Nue'},{id:'rika',name:'Rika'}].map(h=>`<option value="${h.id}">${h.name}</option>`).join('');let playing=true,elapsed=0,last=performance.now(),frame=0;
const enemy=()=>!HEROES.some(h=>h.id===$('hero').value);function rebuild(){elapsed=0;frame=0;$('clip').innerHTML=(enemy()?ENEMY_CLIPS:CLIPS.map(c=>c.id)).map((n,i)=>`<option value="${i}">${n.replaceAll('_',' ')}</option>`).join('');refresh();}function draw(ctx,f){if(enemy())drawEnemyAnimation(ctx,{id:$('hero').value},ENEMY_CLIPS[+$('clip').value],f);else drawHero(ctx,$('hero').value,+$('clip').value,f,$('direction').value);}
function refresh(){const c=$('stage').getContext('2d');c.clearRect(0,0,128,128);draw(c,frame);const strip=$('strip').getContext('2d');strip.clearRect(0,0,1024,128);const n=enemy()?8:CLIPS[+$('clip').value].frames;for(let i=0;i<n;i++){strip.save();strip.translate(i*128,0);draw(strip,i);strip.restore();}$('caption').textContent=`Frame ${frame+1} / ${n} · newly drawn full-body poses`;$('sources').innerHTML=`<a href="art/characters/${$('hero').value}-motion-drawn.png" target="_blank">Open movement / combat sheet</a>${enemy()?'':` · <a href="art/characters/${$('hero').value}-actions-drawn.png" target="_blank">Open interaction sheet</a>`}`;}
$('hero').onchange=rebuild;$('clip').onchange=()=>{elapsed=0;frame=0;refresh();};$('direction').onchange=refresh;$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'Pause':'Play';};$('step').onclick=()=>{playing=false;$('pause').textContent='Play';frame=(frame+1)%(enemy()?8:CLIPS[+$('clip').value].frames);refresh();};rebuild();function tick(now){if(playing){elapsed+=(now-last)/1000;const clip=CLIPS[+$('clip').value],total=enemy()?8/12:clip.frames/clip.fps;const previous=frame;frame=enemy()?Math.floor(elapsed*12)%8:animationFrame({...clip,loop:true},elapsed%total);if(previous!==frame)refresh();}last=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
